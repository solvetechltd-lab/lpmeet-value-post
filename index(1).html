/* ==================== LPMeet BRAND TOKENS (from LPMeet Visual Brand Kit) ==================== */
:root{
  --light-bg:#F4F5F7; --light-surface:#FFFFFF; --light-text:#0A0A0A; --light-muted:#6B7280;
  --light-cta:#111111; --light-border:#E5E7EB; --light-soft:#FFF7ED;
  --dark-bg:#0A0A0A; --dark-surface:#141414; --dark-text:#F5F5F5; --dark-muted:#A3A3A3;
  --dark-cta:#F97316; --dark-border:#2A2A2A; --dark-soft:#1C1209;
  --accent:#F97316; --accent-hover:#EA580C;
  --radius:18px; --radius-sm:12px; --radius-lg:24px; --radius-card:14px;
  --ease:cubic-bezier(.4,0,.2,1); --duration:260ms;
  --sh-low:0 1px 3px rgba(10,10,10,.12),0 3px 8px rgba(10,10,10,.08);
  --sh-raised:0 6px 16px rgba(10,10,10,.12),0 2px 4px rgba(10,10,10,.06);
  --sh-float:0 18px 40px rgba(10,10,10,.2),0 6px 12px rgba(10,10,10,.08);
}
body{
  --bg:var(--light-bg); --surface:var(--light-surface); --text:var(--light-text); --muted:var(--light-muted);
  --muted-strong:#4B5563; --cta:var(--light-cta); --cta-text:#fff; --border:var(--light-border); --border-strong:#CBD0D8;
  --soft:var(--light-soft); --accent-text:#C2410C;
}
body.dark-mode{
  --bg:var(--dark-bg); --surface:var(--dark-surface); --text:var(--dark-text); --muted:var(--dark-muted);
  --muted-strong:#C4C4C4; --cta:var(--dark-cta); --cta-text:#0A0A0A; --border:var(--dark-border); --border-strong:#3A3A3A;
  --soft:var(--dark-soft); --accent-text:#F97316;
  --sh-low:0 1px 2px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.5);
  --sh-raised:0 6px 16px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.45);
  --sh-float:0 18px 40px rgba(0,0,0,.8),0 6px 12px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'MADE TOMMY',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;
  transition:background var(--duration) var(--ease),color var(--duration) var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ==================== LAYOUT ==================== */
.wrap{max-width:1640px;margin:0 auto;padding:0 32px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0}
.brand{flex:none}
.brand img{height:34px;width:auto;max-width:none;display:block}
.brand .logo-dark{display:none}
body.dark-mode .brand .logo-dark{display:block}
body.dark-mode .brand .logo-light{display:none}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:700;border:1px solid var(--border);background:var(--surface);
  transition:all var(--duration) var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--accent);background:var(--soft)}
.btn-primary{background:var(--cta);color:var(--cta-text);border-color:var(--cta)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.btn-sm{padding:8px 12px;font-size:13px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted-strong);display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--cta);color:var(--cta-text)}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;transition:all var(--duration) var(--ease)}
.icon-btn:hover{border-color:var(--accent);background:var(--soft)}

.hero{padding:24px 0 32px;border-bottom:1px solid var(--border)}
.hero h1{font-size:clamp(32px,4.4vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.hero .sub{font-size:clamp(20px,2.4vw,28px);font-weight:700;color:var(--accent-text);margin-top:6px;letter-spacing:-.01em}
.hero p{font-size:16px;color:var(--muted-strong);margin-top:12px;max-width:640px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;padding:24px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;text-align:left;
  transition:all var(--duration) var(--ease);box-shadow:var(--sh-low)}
button.stat:hover{border-color:var(--accent);transform:translateY(-2px)}
.stat[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.stat .n{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-strong);margin-top:4px}
.stat .s{display:block;font-size:12px;color:var(--muted-strong);margin-top:2px}

.toolbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 0}
.toolbar .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;min-height:42px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.search{flex:1 1 260px;min-width:200px;max-width:420px;position:relative}
.search input{width:100%;padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-strong);pointer-events:none}
select.field{padding-right:32px}
.count{margin-left:auto;font-size:13px;color:var(--muted-strong);font-weight:500}

/* ==================== DETAIL DRAWER ==================== */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.32);opacity:0;visibility:hidden;transition:opacity var(--duration) var(--ease),visibility 0s linear var(--duration);z-index:60}
.scrim.open{opacity:1;visibility:visible;transition:opacity var(--duration) var(--ease)}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--sh-float);z-index:70;transform:translateX(100%);visibility:hidden;overflow-y:auto;overscroll-behavior:contain;
  transition:transform var(--duration) var(--ease),visibility 0s linear var(--duration)}
.drawer.open{transform:none;visibility:visible;transition:transform var(--duration) var(--ease)}
.d-bar{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border)}
.d-bar .pos{font-size:13px;color:var(--muted-strong);font-weight:500;margin-right:auto;padding-left:6px}
.d-body{padding:24px 24px 64px;display:flex;flex-direction:column;gap:24px}
.d-media img{display:block;width:100%;height:auto;border-radius:var(--radius-card);border:1px solid var(--border);cursor:zoom-in}
.d-drop{display:grid;place-items:center;text-align:center;border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:48px 24px;cursor:pointer;transition:all var(--duration) var(--ease)}
.d-drop:hover,.d-drop.dragover{border-color:var(--accent);background:var(--soft)}
.d-drop b{display:block;font-size:16px;margin:8px 0 2px}
.d-drop span{font-size:13px;color:var(--muted-strong)}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.d-title{display:flex;flex-direction:column;gap:6px}
.d-title .eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.d-title h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 24px;padding:20px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--cta);color:var(--cta-text);padding:12px 18px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:700;box-shadow:var(--sh-float);z-index:120;opacity:0;pointer-events:none;transition:all var(--duration) var(--ease);max-width:calc(100% - 32px)}

.cal-item{min-height:0;cursor:grab;padding:8px;gap:4px}

.x-list{display:grid;gap:8px;margin-top:10px}
.x-file{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.x-file .xt{width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent-text)}
.x-file .xt img{width:100%;height:100%;object-fit:cover}
.x-file b{flex:1;min-width:0;word-break:break-all;font-size:13px}
.x-file span.sz{font-size:12px;color:var(--muted-strong);white-space:nowrap}
.sched .row3{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:12px}
.sched .row3 .field{width:100%}
.fmt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.fmt .btn{padding:4px 10px;font-size:13px}
.fmt .grow{flex:1}
.sec{display:flex;flex-direction:column}
.d-area{width:100%;min-height:90px;resize:vertical;line-height:1.55}
textarea.d-area.tall{min-height:240px}
textarea.d-area.short{min-height:64px}
textarea.d-area.mid{min-height:130px}
.d-foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border);align-items:center}
.saved{font-size:12px;color:var(--muted-strong);margin-left:auto}
.d-drop{padding:30px 20px}
.d-drop.dragover{border-color:var(--accent);background:var(--soft)}

/* ---------- value post file tab ---------- */
.vf-head{padding:24px 0 8px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.vf-head h1{font-size:clamp(28px,3.6vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.vf-head p{font-size:15px;color:var(--muted-strong);margin-top:8px;max-width:720px}
.vf-bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 0;margin-bottom:24px}
.vf-bar .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.vf-bar .jump{display:flex;gap:6px;align-items:center}
.vf-bar .jump input{width:96px}
.vf-cat{margin-bottom:40px}
.vf-cat > h2{font-size:clamp(18px,2vw,22px);font-weight:800;letter-spacing:-.02em;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.vf-cat > h2 small{font-size:13px;font-weight:500;color:var(--muted-strong);margin-left:auto}
.vf-row{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:8px;box-shadow:var(--sh-low);transition:border-color var(--duration) var(--ease)}
.vf-row:hover,.vf-row.open{border-color:rgba(249,115,22,.55)}
.vf-hd{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px}
.vf-hd .bd{flex:none;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent-text);background:var(--soft);border:1px solid rgba(249,115,22,.35);border-radius:99px;padding:3px 10px}
.vf-hd .hl{flex:1;min-width:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
.vf-hd .vd{flex:none;font-size:12px;color:var(--muted-strong);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vf-hd .inhub{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#15803D;background:rgba(34,197,94,.12);border-radius:99px;padding:2px 8px}
body.dark-mode .vf-hd .inhub{color:#4ADE80}
.vf-hd svg.chev{transition:transform var(--duration) var(--ease);flex:none}
.vf-row.open .vf-hd svg.chev{transform:rotate(90deg)}
.vf-body{padding:4px 16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;border-top:1px solid var(--border)}
.vf-body .blk{min-width:0}
.vf-body .blk.wide{grid-column:1/-1}
.vf-body .lbl{margin-top:14px}
.vf-body .tx{font-size:14px;line-height:1.65;white-space:pre-wrap}
.vf-body .tx b{color:var(--accent-text)}
.vf-body .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tagpill{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-text);background:var(--soft);border:1px solid rgba(249,115,22,.35);border-radius:99px;padding:2px 10px;margin-bottom:4px}
.hl-m{background:rgba(249,115,22,.25);border-radius:3px}

/* ---------- modals (extra) ---------- */
.drop-big{display:grid;place-items:center;text-align:center;border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:36px 20px;cursor:pointer;transition:all var(--duration) var(--ease)}
.drop-big:hover,.drop-big.dragover{border-color:var(--accent);background:var(--soft)}
.drop-big b{display:block;font-size:16px;margin:6px 0 2px}
.drop-big span{font-size:13px;color:var(--muted-strong)}
.match-list{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.match-list table{width:100%;border-collapse:collapse;font-size:13px}
.match-list td,.match-list th{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left}
.match-list th{position:sticky;top:0;background:var(--surface);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-strong)}
.match-list tr.bad td{color:#DC2626}
.prog{height:8px;border-radius:8px;background:var(--border);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.dayrow{display:flex;gap:6px;flex-wrap:wrap}
.dayrow label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--surface)}
.dayrow label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.dayrow input{accent-color:var(--accent)}
.meter{height:10px;border-radius:10px;background:var(--border);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--accent)}
.modal textarea.field{min-height:120px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.modal .hint{font-size:13px;color:var(--muted-strong)}
.modal .hint b{color:var(--text)}
.modal .rowf{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modal .rowf .field{width:auto;flex:1 1 120px}

@media(max-width:700px){
  .sched .row3{grid-template-columns:1fr}
  .vf-body{grid-template-columns:1fr}
  .vf-hd .vd{display:none}
  .vf-bar{position:static}
  .tab{padding:12px 14px}
  .hero-tools{width:100%}
}
.toolbar .wrap{padding:0}
.toolbar{margin:0}

/* ---------- poster gallery ---------- */
.d-poster{position:relative}
.ps-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(10,10,10,.65);color:#fff;display:grid;place-items:center;z-index:2;transition:background var(--duration) var(--ease)}
.ps-nav:hover{background:var(--accent);color:#0A0A0A}
.ps-nav.prev{left:12px}.ps-nav.next{right:12px}
.slot-h .cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted-strong)}
.p-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.p-th{position:relative;width:64px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:2px solid var(--border);padding:0;background:var(--bg);display:grid;place-items:center;transition:border-color var(--duration) var(--ease)}
.p-th img{display:block;width:100%;height:100%;object-fit:cover}
.p-th:hover{border-color:var(--accent)}
.p-th.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(249,115,22,.25)}
.p-th .cv{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,10,.75);color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:2px 0}
.p-th.add{border:1.5px dashed var(--border-strong);color:var(--accent-text)}
.p-th.add:hover{background:var(--soft)}
.d-bar .btn{white-space:nowrap}

/* ---------- slide between posts ---------- */
@keyframes slideNext{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes slidePrev{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
.d-body.slide-next{animation:slideNext .28s var(--ease)}
.d-body.slide-prev{animation:slidePrev .28s var(--ease)}
@media(max-width:700px){.d-bar .btn{padding:8px 10px;font-size:12px}}
.d-poster img{max-height:78vh;object-fit:contain;background:var(--bg)}

/* ---------- resizable panel ---------- */
.drawer{width:min(var(--dw,700px),100%)}
#dResize{position:fixed;top:0;bottom:0;width:14px;z-index:75;cursor:ew-resize;touch-action:none;display:flex;justify-content:center;align-items:center}
#dResize::before{content:"";width:4px;height:56px;border-radius:4px;background:var(--border-strong);transition:background var(--duration) var(--ease),height var(--duration) var(--ease)}
#dResize:hover::before,#dResize:focus-visible::before,body.resizing #dResize::before{background:var(--accent);height:96px}
body.resizing{user-select:none;cursor:ew-resize}
body.resizing .drawer{transition:none}
@media(max-width:700px){#dResize{display:none}}

/* ---- shared hub: view-only mode for visitors ---- */
#acctBtn.on{border-color:var(--ok,#1a9d5a);color:var(--ok,#1a9d5a)}
body.readonly [data-act="open-bulk-upload"],body.readonly [data-act="open-bulk-schedule"],body.readonly [data-act="open-data"],
body.readonly [data-act="up-poster"],body.readonly [data-act="up-poster-replace"],body.readonly [data-act="up-video"],body.readonly [data-act="up-extra"],
body.readonly [data-act="rm-asset"],body.readonly [data-act="p-cover"],body.readonly [data-act="del-post"],body.readonly [data-act="clear-date"],
body.readonly [data-act="next-slot"],body.readonly [data-act="vf-add"]{display:none!important}
body.readonly .tray{display:none}

</style>

const Local = {

  async open() {

}

function calMonths() {
  const cur = todayStr().slice(0, 7), dated = S.posts.filter((p) => p.date).map((p) => monthOf(p.date)).sort();
  let start = dated.length && dated[0] < cur ? dated[0] : cur, end = addMonths(cur, 11); if (dated.length && dated[dated.length - 1] > end) end = dated[dated.length - 1];
  const out = []; for (let k = start; k <= end; k = addMonths(k, 1)) out.push(k); return out;
}
function defaultCalMonth() {
  const cur = todayStr().slice(0, 7), dated = S.posts.filter((p) => p.date && p.date >= todayStr()).map((p) => p.date).sort();
  return dated.length ? monthOf(dated[0]) : cur;
}

function renderCalendar() {

  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const end = new Date(last); end.setDate(last.getDate() + (7 - ((last.getDay() + 6) % 7 + 1)));
  const vis = new Set(visiblePosts().map((p) => p.id));
  const byDate = {}; S.posts.forEach((p) => { if (p.date && vis.has(p.id)) (byDate[p.date] = byDate[p.date] || []).push(p); });
  Object.keys(byDate).forEach((k) => byDate[k].sort((x, y) => x.n - y.n));

  const months = calMonths(); if (!months.includes(S.calMonth)) months.push(S.calMonth), months.sort();

  const trayHTML = '<div class="tray" data-tray="1"><h3>Not scheduled yet · ' + tray.length + '</h3><p class="h">' + (tray.length ? "Drag a post onto a day to set its date, or click a day to choose one." : "Every shown post has a date. Drag a post here to clear its date.") + "</p><div class=\"tray-list\">" +
    tray.map((p) => '<div class="chip" draggable="true" role="button" tabindex="0" data-id="' + p.id + '"><span class="s">#' + pad3(p.n) + '</span><span class="t">' + esc(p.headline) + "</span></div>").join("") + "</div></div>";
  const hdr = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => '<div class="mcal-h' + (CFG.postingDays.includes(DOW.indexOf(d)) ? " pd" : "") + '">' + d + (CFG.postingDays.includes(DOW.indexOf(d)) ? " · post day" : "") + "</div>").join("");
  let cells = "";

/* Unicode bold / italic for Facebook (it has no markdown) */
function plainChar(c) {

  for (const r of R) if (c >= r[0] && c < r[0] + 26) return r[1] + (c - r[0]);
  if (c >= 0x1D7EC && c < 0x1D7EC + 10) return 48 + (c - 0x1D7EC);
  return c;
}
function styleText(s, mode) {

    let c = plainChar(ch.codePointAt(0));
    if (mode === "b") { if (c >= 65 && c <= 90) c = 0x1D5D4 + c - 65; else if (c >= 97 && c <= 122) c = 0x1D5EE + c - 97; else if (c >= 48 && c <= 57) c = 0x1D7EC + c - 48; }
    else if (mode === "i") { if (c >= 65 && c <= 90) c = 0x1D608 + c - 65; else if (c >= 97 && c <= 122) c = 0x1D622 + c - 97; }
    out += String.fromCodePoint(c);

}
function applyFmt(id, mode) {

/* ---------- bulk upload (filename → topic number) ---------- */
function numFromName(name) {
  const base = name.replace(/\.[^.]+$/, "").replace(/\d{3,5}\s*[x×]\s*\d{3,5}/gi, " ");
  const m = /(?<!\d)(\d{1,3})(?!\d)/.exec(base); return m ? parseInt(m[1], 10) : 0;
}
let bulkFiles = [];
function planBulk(files, replace) {
  const rows = [], seenPoster = new Set(), seenVideo = new Set();
  files.slice().sort(natural).forEach((f) => {
    const n = numFromName(f.name), kind = kindOf(f), p = n ? getPostByN(n) : null; let slot = "", note = "ok";
    if (!n) note = "no topic number in the file name";

      slot = "poster"; if (replace && p.posterIds.length && !seenPoster.has(n)) note = "replaces the cover"; else if (p.posterIds.length || seenPoster.has(n)) note = "added as another poster";
      seenPoster.add(n);
    } else if (kind === "video") {
      if ((!p.videoId || replace) && !seenVideo.has(n)) { slot = "video"; seenVideo.add(n); } else slot = "extra";
    } else slot = "extra";
    rows.push({ f, n, p, slot, note, bad: !slot, swap: slot === "poster" && note === "replaces the cover" });
  });

}

/* ---------- bulk schedule ---------- */

  return {
    start: $("#bsStart").value, days: $$("input[name=bsDay]:checked").map((i) => +i.value), time: $("#bsTime").value, per: Math.max(1, +$("#bsPer").value || 1),
    from: +$("#bsFrom").value || 1, to: +$("#bsTo").value || 9999, mode: $("input[name=bsMode]:checked").value, skip: $("#bsSkip").checked

}
function computeSchedule(o) {

  const tset = new Set(targets.map((p) => p.id)), occ = new Set(); S.posts.forEach((p) => { if (p.date && !tset.has(p.id)) occ.add(p.date); });
  const out = []; if (!o.start || !o.days.length) return { out, targets };

    d = addDays(d, 1);
  }
  return { out, targets };
}

    if (act === "bk-json") return backup(false);

    if (act === "import-pick") { $("#importFile").value = ""; $("#importFile").click(); return; }
    if (act === "tpl-csv") { saveAs(new Blob([templateCSV()], { type: "text/csv" }), CFG.id + "-topics-template.csv"); return; }
    if (act === "add-range") return addRange();
    if (act === "reset-hub") return resetHub();
    if (act === "clear-filters") { S.q = ""; S.cat = S.batch = S.status = S.ready = "all"; $("#q").value = ""; renderView(); return; }
    if (act === "toggle-group") { const g = actEl.closest(".grp"), k = g.dataset.gk; if (S.collapsed.has(k)) S.collapsed.delete(k); else S.collapsed.add(k); lsSet("collapsed", Array.from(S.collapsed)); g.classList.toggle("closed"); actEl.setAttribute("aria-expanded", String(!g.classList.contains("closed"))); return; }
    if (act === "cal-prev" || act === "cal-next") { S.calMonth = addMonths(S.calMonth, act === "cal-prev" ? -1 : 1); renderView(); return; }
    if (act === "pick-post") { const p = getPost(id); if (p) { await setPostDate(p, actEl.dataset.date); closeModal(); renderView(); toast(labelOf(p.n) + " scheduled for " + fmtLong(actEl.dataset.date)); } return; }
    if (act === "up-poster") { e.stopPropagation(); pickFile(id, "poster"); return; }
    if (act === "up-video") { e.stopPropagation(); pickFile(id, "video"); return; }
    if (act === "up-extra") { pickFile(id, "extra"); return; }
    if (act === "up-poster-replace") { pickFile(id, "poster", actEl.dataset.aid); return; }
    if (act === "p-prev" || act === "p-next") { const p = getPost(S.openId), n = p ? p.posterIds.length : 0; if (n > 1) { S.pIdx = (S.pIdx + (act === "p-next" ? 1 : -1) + n) % n; $("#posterBlock").innerHTML = posterBlock(p); } return; }
    if (act === "p-sel") { const p = getPost(S.openId); if (p) { S.pIdx = +actEl.dataset.i; $("#posterBlock").innerHTML = posterBlock(p); } return; }
    if (act === "p-cover") { const p = getPost(S.openId); if (p) { const a = actEl.dataset.aid; p.posterIds = [a].concat(p.posterIds.filter((x) => x !== a)); p.posterId = a; S.pIdx = 0; await saveNow(p); refreshDrawerBlocks(); toast("Now the cover for " + labelOf(p.n) + "."); } return; }
    /* file tab */
    if (act === "vf-toggle") return vfToggle(+actEl.dataset.n);
    if (act === "vf-expand") { fileTopics().forEach((t) => S.vfOpen.add(t.n)); renderFile(); return; }
    if (act === "vf-collapse") { S.vfOpen.clear(); renderFile(); return; }
    if (act === "vf-jump") { const n = +$("#vfJump").value; const t = SRC.topics.find((x) => x.n === n); if (!t) { toast("No topic " + n + " in the file.", true); return; } S.fq = ""; S.fcat = "all"; S.fhub = "all"; $("#fq").value = ""; renderFile(); vfToggle(n, true); const r = $("#vf-" + n); if (r) r.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    if (act === "vf-csv") { saveAs(new Blob([fileCSV()], { type: "text/csv" }), CFG.id + "-value-post-file.csv"); return; }
    if (act === "vf-md") { saveAs(new Blob([fileMD()], { type: "text/markdown" }), CFG.id + "-value-post-file.md"); return; }
    if (act === "vf-open-hub") { const p = getPostByN(+actEl.dataset.n); if (p) { setTab("hub"); openDrawer(p.id, actEl); } return; }
    if (act === "vf-add") { const t = SRC.topics.find((x) => x.n === +actEl.dataset.n); if (t) { await addTopics([t], false); renderFile(); renderStats(); toast(labelOf(t.n) + " added to the hub."); } return; }
    if (act === "vf-copy") { const t = SRC.topics.find((x) => x.n === +actEl.dataset.n); if (t) copyText(topicFullText(t), "Full post copied."); return; }
    if (act === "vf-copy-script") { const t = SRC.topics.find((x) => x.n === +actEl.dataset.n); if (t) copyText(t.script, "Script copied."); return; }
    /* drawer + lightbox */
    if (act === "close") return closeDrawer();
    if (act === "prev") return stepPost(-1);
    if (act === "next") return stepPost(1);
    if (act === "open-lb") return openLightbox(actEl.dataset.aid);
    if (act === "lb-open-poster") { const p = getPost(S.openId); if (p) openLightbox(p.posterId); return; }
    if (act === "lb-close") return closeLightbox();
    if (act === "lb-prev") return lbShow(-1);
    if (act === "lb-next") return lbShow(1);
    if (act === "dl-asset") { const a = asset(actEl.dataset.aid); if (a) downloadAsset(a); return; }
    if (act === "rm-asset") { const a = asset(actEl.dataset.aid); if (a && await confirmDlg({ title: "Remove file?", body: "Remove <b>" + esc(a.name) + "</b> from this post?", ok: "Remove", danger: true })) { await removeAsset(a.id); refreshDrawerBlocks(); } return; }
    if (act === "fmt") return applyFmt(actEl.dataset.t, actEl.dataset.m);
    if (act === "copy-full") { const p = getPost(S.openId); if (p) copyText(fullPostText(p), "Full post copied. Paste it into Facebook."); return; }
    if (act === "copy-caption") { const p = getPost(S.openId); if (p) copyText(p.caption, "Caption copied."); return; }
    if (act === "copy-script") { const p = getPost(S.openId); if (p) copyText(p.script, "Script copied."); return; }
    if (act === "next-slot") return nextSlot();
    if (act === "clear-date") { const p = getPost(S.openId); if (p) { await setPostDate(p, ""); $("#f_date").value = ""; $("#dateHint").innerHTML = dateHint(p); renderView(); } return; }
    if (act === "del-post") { const p = getPost(S.openId); if (p && await confirmDlg({ title: "Remove from the hub?", body: "Delete <b>" + esc(labelOf(p.n)) + "</b> with its poster, video and notes? It stays in the Value Post File and you can add it back.", ok: "Remove", danger: true })) { const pid = p.id; S.openId = null; await deletePost(pid); $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); document.body.style.overflow = ""; renderView(); renderFile(); toast("Removed."); } return; }
    if (act === "day") { if (!e.target.closest(".cal-item")) pickPostDialog(actEl.dataset.date); }
    if (e.target.closest("#scrim")) return closeDrawer();
    if (e.target.closest("#lightbox") && !e.target.closest("button,img")) return closeLightbox();
    if (e.target.id === "modalBg") return closeModal();
    const calI = e.target.closest(".cal-item,.chip"); if (calI) { openDrawer(calI.dataset.id, calI); return; }
    const card = e.target.closest(".card"); if (card) { openDrawer(card.dataset.id, card); return; }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if ($("#cfBg").classList.contains("open")) return cfClose(false);
      if ($("#lightbox").classList.contains("open")) return closeLightbox();
      if ($("#modalBg").classList.contains("open")) return closeModal();
      if (S.openId) return closeDrawer();
    }
    const tgt = e.target;
    if ((e.key === "Enter" || e.key === " ") && tgt.matches && tgt.matches(".card,.cal-item,.chip,.mcal-day,.dz-slot")) { e.preventDefault(); tgt.click(); }
    if (S.openId && !/INPUT|TEXTAREA|SELECT/.test(tgt.tagName) && !$("#lightbox").classList.contains("open") && !$("#modalBg").classList.contains("open")) {
      if (e.key === "ArrowLeft") stepPost(-1); if (e.key === "ArrowRight") stepPost(1);
    }
    if ($("#lightbox").classList.contains("open")) { if (e.key === "ArrowLeft") lbShow(-1); if (e.key === "ArrowRight") lbShow(1); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "q") { S.q = e.target.value.trim().toLowerCase(); clearTimeout(bind.t); bind.t = setTimeout(renderView, 180); }
    else if (e.target.id === "fq") { S.fq = e.target.value; clearTimeout(bind.t2); bind.t2 = setTimeout(renderFile, 180); }
    else onField(e);
  });
  document.addEventListener("change", (e) => {
    const id = e.target.id;
    if (id === "fCat") { S.cat = e.target.value; renderView(); }
    else if (id === "fBatch") { S.batch = e.target.value; renderView(); }
    else if (id === "fStatus") { S.status = e.target.value; renderView(); }
    else if (id === "fReady") { S.ready = e.target.value; renderView(); }
    else if (id === "fGroup") { S.group = e.target.value; lsSet("group", S.group); renderView(); }
    else if (id === "calSel") { S.calMonth = e.target.value; renderView(); }
    else if (id === "vfCat") { S.fcat = e.target.value; renderFile(); }
    else if (id === "vfHub") { S.fhub = e.target.value; renderFile(); }
    else if (id === "file") { const t = uploadTarget; if (t) handleFiles(t.postId, e.target.files, t.role, t.replaceId); }
    else if (id === "restoreFile") { if (e.target.files[0]) restoreFrom(e.target.files[0]); }
    else if (id === "importFile") { if (e.target.files[0]) importTopics(e.target.files[0]); }
    else onField(e);
  });
  /* drag & drop: files onto covers/slots; posts onto calendar days */
  document.addEventListener("dragstart", (e) => {
    const it = e.target.closest && e.target.closest(".cal-item,.chip"); if (!it) return;
    dragId = it.dataset.id; it.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch (er) { /* ignore */ }
  });
  document.addEventListener("dragend", () => { dragId = null; $$(".dragging").forEach((x) => x.classList.remove("dragging")); $$(".over").forEach((x) => x.classList.remove("over")); });
  document.addEventListener("dragover", (e) => {
    if (hasFiles(e)) { e.preventDefault(); const z = e.target.closest(".dz,.dz-slot"); $$(".dragover").forEach((x) => { if (x !== z && !x.closest("#modalBg")) x.classList.remove("dragover"); }); if (z) z.classList.add("dragover"); return; }
    if (!dragId) return;
    const day = e.target.closest(".mcal-day"), tray = e.target.closest(".tray");
    if (day || tray) { e.preventDefault(); $$(".over").forEach((x) => x.classList.remove("over")); (day || tray).classList.add("over"); }
  });
  document.addEventListener("drop", async (e) => {
    if (hasFiles(e)) {
      if (e.target.closest("#bulkDrop")) return;
      e.preventDefault(); $$(".dragover").forEach((x) => x.classList.remove("dragover"));
      const slot = e.target.closest(".dz-slot"), card = e.target.closest(".dz");
      if (slot) await handleFiles(slot.dataset.id, e.dataTransfer.files, slot.dataset.slot);
      else if (card) await handleFiles(card.dataset.id, e.dataTransfer.files, "auto");
      else if (S.openId && e.target.closest("#drawer")) await handleFiles(S.openId, e.dataTransfer.files, "auto");
      return;
    }
    if (!dragId) return;
    const day = e.target.closest(".mcal-day"), tray = e.target.closest(".tray"), p = getPost(dragId);
    if (p && day) { e.preventDefault(); await setPostDate(p, day.dataset.date); renderView(); toast(labelOf(p.n) + " → " + fmtLong(day.dataset.date)); }
    else if (p && tray) { e.preventDefault(); await setPostDate(p, ""); renderView(); toast(labelOf(p.n) + " moved back to unscheduled."); }
    dragId = null;
  });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("pagehide", flushSaves);
  window.addEventListener("resize", syncToolbarHeight);
}

/* ---------- keep two open tabs of the hub in sync ---------- */
function refreshUI() {
  renderView(); if (S.tab === "file") renderFile();
  if (S.openId) {
    const p = getPost(S.openId), d = $("#drawer");
    if (!p) { S.openId = null; d.classList.remove("open"); $("#scrim").classList.remove("open"); }
    else if (!d.contains(document.activeElement) || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { const t = d.scrollTop; d.innerHTML = drawerHTML(p); d.scrollTop = t; }
  }
}
async function reloadFromStore() {
  if (!Store.ok) return;
  await flushSaves();
  const posts = await Store.all("posts"), assets = await Store.all("assets");
  S.posts = posts.map(normPost); S.assets = new Map(assets.map((a) => [a.id, a]));
  if (!Cloud.on) { const blobs = await Store.all("blobs"); S.blobs = new Map(blobs.map((b) => [b.id, b.blob])); }
  if (!S.posts.length && !Store.canWrite()) viewSeed();
  refreshUI();
}
/* a visitor opening a brand-new hub sees the starting topics (in memory only) until a team member saves them */
function viewSeed() { SRC.topics.filter((t) => t.n >= CFG.seedRange[0] && t.n <= CFG.seedRange[1]).forEach((t) => S.posts.push(postFromTopic(t))); }
let syncTimer;
const queueReload = () => { clearTimeout(syncTimer); syncTimer = setTimeout(() => { reloadFromStore().catch((e) => console.error(errText(e))); }, 250); };

/* ---------- init ---------- */
async function init() {
  const saved = lsGet("theme", null); applyTheme(saved ? saved === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches));
  S.view = lsGet("view", "board"); S.tab = lsGet("tab", "hub"); S.group = lsGet("group", "category"); S.collapsed = new Set(lsGet("collapsed", []));
  renderHero();
  const ok = await Store.open();
  if (Cloud.on) { await applyAuth(); bindCloud(); }
  if (!ok) $("#banner").innerHTML = '<div class="banner"><b>Storage is blocked in this browser.</b> The hub works, but your posters, dates and edits are only kept until you close this tab. Open the file in Chrome, Edge or Safari from your computer, or use <b>Data → Backup</b> before you leave.</div>';
  let offline = "";
  try {
    for (const p of await Store.all("posts")) S.posts.push(p);
    for (const a of await Store.all("assets")) S.assets.set(a.id, a);
  } catch (e) {
    console.error(e); offline = errText(e);
    $("#banner").innerHTML = '<div class="banner"><b>Couldn\'t reach the shared hub.</b> Showing the starting topics, view only. ' + esc(offline) + ' <button class="btn btn-sm" type="button" onclick="location.reload()">Try again</button></div>';
  }
  if (!Cloud.on) for (const b of await Store.all("blobs")) S.blobs.set(b.id, b.blob);
  S.posts.forEach(normPost);
  /* older saves kept extra images as "extras": they now join the poster gallery */
  for (const p of S.posts) {
    const imgs = p.extras.filter((id) => { const a = S.assets.get(id); return a && a.kind === "image"; });
    if (imgs.length && Store.canWrite()) { p.extras = p.extras.filter((id) => !imgs.includes(id)); p.posterIds = p.posterIds.concat(imgs); p.posterId = p.posterIds[0] || ""; await saveNow(p); }
  }
  if (Store.canWrite() && !offline) await seedIfNeeded(false); else if (!S.posts.length) viewSeed();
  bind(); setTab(S.tab);
  if (Cloud.on && !offline) { try { Cloud.startLive(onLiveChange); } catch (e) { console.error(e); } }
  if (bc) bc.onmessage = queueReload;
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") queueReload(); });
  const hash = /^#topic-(\d+)$/.exec(location.hash || ""); if (hash) { const p = getPostByN(+hash[1]); if (p) openDrawer(p.id); }
  /* drag the panel's left edge to resize it */
  const rz = $("#dResize"), drw = $("#drawer"); let dragging = false;
  const place = () => { rz.style.left = (innerWidth - drw.offsetWidth - 7) + "px"; };
  const setW = (w) => { w = Math.round(Math.max(360, Math.min(w, innerWidth - 24))); document.documentElement.style.setProperty("--dw", w + "px"); lsSet("dw", w); place(); };
  const sync = () => { rz.hidden = !drw.classList.contains("open"); if (!rz.hidden) place(); };
  const savedW = lsGet("dw", 0); if (savedW) document.documentElement.style.setProperty("--dw", savedW + "px");
  new MutationObserver(sync).observe(drw, { attributes: true, attributeFilter: ["class"] });
  window.addEventListener("resize", () => { if (!rz.hidden) place(); });
  rz.addEventListener("pointerdown", (e) => { dragging = true; rz.setPointerCapture(e.pointerId); document.body.classList.add("resizing"); e.preventDefault(); });
  rz.addEventListener("pointermove", (e) => { if (dragging) setW(innerWidth - e.clientX); });
  const stop = () => { dragging = false; document.body.classList.remove("resizing"); };
  rz.addEventListener("pointerup", stop); rz.addEventListener("pointercancel", stop); rz.addEventListener("lostpointercapture", stop);
  rz.addEventListener("dblclick", () => setW(700));
  rz.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { setW(drw.offsetWidth + 40); e.preventDefault(); } if (e.key === "ArrowRight") { setW(drw.offsetWidth - 40); e.preventDefault(); } });
  /* swipe the panel: left/right changes post (or poster when you swipe on the poster) */
  let sx = 0, sy = 0, st = null;
  const dr = $("#drawer");
  dr.addEventListener("touchstart", (e) => { if (e.touches.length !== 1 || /INPUT|TEXTAREA|SELECT|VIDEO/.test(e.target.tagName)) { st = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = e.target; }, { passive: true });
  dr.addEventListener("touchend", (e) => {
    if (!st) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy, on = st; st = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const p = getPost(S.openId); if (on.closest && on.closest(".d-poster") && p && p.posterIds.length > 1) { S.pIdx = (S.pIdx + (dx < 0 ? 1 : -1) + p.posterIds.length) % p.posterIds.length; $("#posterBlock").innerHTML = posterBlock(p); }
    else stepPost(dx < 0 ? 1 : -1);
  }, { passive: true });
}
init().catch((e) => { console.error(e); const b = $("#banner"); if (b) b.innerHTML = '<div class="banner"><b>Something went wrong while loading.</b> ' + esc(errText(e)) + "</div>"; });
})();

</script>
